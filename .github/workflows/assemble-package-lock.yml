name: Assemble package-lock.json
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/assemble-package-lock.yml'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download real npm lockfile
        run: |
          set -euo pipefail
          curl -fsSL -o package-lock.json "https://litter.catbox.moe/p9uul6.json"
          python3 - <<'PY'
          import json, hashlib
          from pathlib import Path
          raw = Path('package-lock.json').read_text()
          assert len(raw) > 10000
          assert raw.strip() != 'PLACEHOLDER'
          data = json.loads(raw)
          assert data.get('lockfileVersion') == 3
          assert data.get('name') == 'idg-im-unterricht'
          print('ok', len(raw), hashlib.sha256(raw.encode()).hexdigest())
          PY
      - name: Commit package-lock.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          # cleanup temp probes if present
          git rm -f --ignore-unmatch _agent_size_probe.txt _agent_chunk_test.txt || true
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Replace placeholder package-lock.json with real npm lockfile"
          git push
